<!DOCTYPE html>

    <style>
        * {
            box-sizing: border-box;
        }

        .card-hover {
            transition: all 0.25s ease;
        }

            .card-hover:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            }

        input[type="date"] {
            min-height: 38px;
        }

        select {
            min-height: 38px;
        }

       .layout-top {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 1024px) {
            .layout-top {
                grid-template-columns: minmax(240px, 315px) 1fr;
            }
        }

        .grid-wrap {
            overflow-x: auto;
        }

        .status-grid {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 12px;
        }

        .status-grid th,
        .status-grid td {
            border: 1px solid #e5e7eb;
            padding: 4px;
            text-align: center;
        }

        .status-grid td {
            height: 24px;
        }

        .cell-empty {
            background: #f3f4f6;
        }

        .cell-waiting {
            background: #93c5fd;
        }

        .cell-success {
            background: #42B983;
        }

        .cell-teaching {
            background: #7f1d1d;
        }

        .cell-timeout {
            background: #9ca3af;
        }

        .cell-future {
            background: #facc15;
        }

        .cell-failed {
            background: #F56C6C;
        }

        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>

       // ---------- 增强的 postToServer ----------
       async function postToServer(url, payload) {
           // 确保 payload 有效
           if (payload === undefined || payload === null) {
               throw new Error('请求负载不能为空');
           }

           let body;
           try {
               body = JSON.stringify(payload);
           } catch (e) {
               throw new Error('请求负载序列化失败');
           }

           // 调试日志（可删除）
           console.log('Sending to', url, 'payload:', payload, 'body:', body);

           const response = await fetch(url, {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: body,
               credentials: 'same-origin',  // 保持同域 cookie
               cache: 'no-cache'             // 避免 Safari 缓存请求
           });

           let result = null;
           try {
               result = await response.json();
           } catch (error) {
               result = null;
           }

           if (!response.ok) {
               throw new Error((result && result.message) || '服务器请求失败');
           }

           if (result && result.success === false) {
               throw new Error(result.message || '服务器返回失败');
           }

           return result || {};
       }

       function getTodayDate() { return new Date().toISOString().split('T')[0]; }

           try {

                   change: autopaySwitch.checked
               });

           } finally {
               setAutoPayLoading(false);
           }
       }

       function getNowDateTimeString() {
           const now = new Date();
           const yyyy = now.getFullYear();
           const mm = String(now.getMonth() + 1).padStart(2, '0');
           const dd = String(now.getDate()).padStart(2, '0');
           const hh = String(now.getHours()).padStart(2, '0');
           const mi = String(now.getMinutes()).padStart(2, '0');
           const ss = String(now.getSeconds()).padStart(2, '0');
           return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
       }

       function getWeekdayText(dateText) {
           if (!dateText) return '';
           const dateObj = new Date(`${dateText}T00:00:00`);
           if (Number.isNaN(dateObj.getTime())) return '';
           const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
           return weekDays[dateObj.getDay()] || '';
       }

       function formatCourt(court) {
           if (!court) return 'Court-xx';
           const raw = String(court);
           if (raw.toLowerCase().startsWith('court-')) return raw;
           return `Court-${raw}`;
       }

       function formatTimeRange(time) {
           if (!time) return 'xx:00-yy:00';
           const raw = String(time);
           const rangeMatch = raw.match(/^(\d{1,2}):00-(\d{1,2}):00$/);
           if (rangeMatch) {
               const start = rangeMatch[1].padStart(2, '0');
               const end = rangeMatch[2].padStart(2, '0');
               return `${start}:00-${end}:00`;
           }
           if (/^\d{1,2}$/.test(raw)) {
               const startHour = Number(raw);
               if (!Number.isNaN(startHour) && startHour >= 0 && startHour <= 23) {
                   const endHour = (startHour + 1) % 24;
                   return `${String(startHour).padStart(2, '0')}:00-${String(endHour).padStart(2, '0')}:00`;
               }
           }
           return raw;
       }

       function setButtonLoading(button, isLoading, loadingText) {
           if (isLoading) {
               button.dataset.originalHtml = button.innerHTML;
               button.disabled = true;
               button.classList.add('opacity-60', 'cursor-not-allowed');
               button.textContent = loadingText;
               return;
           }
           button.disabled = false;
           button.classList.remove('opacity-60', 'cursor-not-allowed');
           if (button.dataset.originalHtml) {

       function normalizeTask(task) {
           if (!task || typeof task !== 'object') {
               return { date: getTodayDate(), court: '', time: '', text: '', message: '', uniqueid: '', resultStatus: '', resultInfo: '', reservationId: '' };
           }
           const responseData = task.response && task.response.data ? task.response.data : {};
           const resultStatus = String(responseData.status || task.status || '').toLowerCase();
           const resultInfo = String(responseData.info || task.info || task.message || '').trim();
           return {
               date: task.date || task.taskDate || getTodayDate(),
               court: task.court || task.number || task.num || task.value || '',
               time: task.time || task.timeRange || '',
               text: task.text || task.title || task.content || '',
               message: task.message || task.content || '',
               uniqueid: task.uniqueid || task.uniqueId || task.id || '',
               reservationId: task.reservationId || task.reservationID || '',
               resultStatus: resultStatus,
               resultInfo: resultInfo
           };
       }

       function createTaskItem(task, panel) {
           const normalizedTask = normalizeTask(task);

           const isPending = panel === 'pending';
           const item = document.createElement('div');

           item.setAttribute('data-task-item', '1');
           if (normalizedTask.uniqueid) {
               item.dataset.uniqueid = String(normalizedTask.uniqueid);
           }

           const info = document.createElement('div');
           const lineSummary = document.createElement('div');
           lineSummary.className = 'text-sm text-gray-500';
           lineSummary.textContent = `日期：${normalizedTask.date || 'year-mon-day'}, 场地: ${formatCourt(normalizedTask.court)}, 时间: ${formatTimeRange(normalizedTask.time)}`;
           const lineText = document.createElement('div');
           lineText.className = 'font-medium mt-1';
           if (isPending) {
               lineText.textContent = `ReservationID: ${normalizedTask.reservationId || '-'}`;
           } else {
               lineText.textContent = normalizedTask.message || normalizedTask.text || '';
           }
           info.appendChild(lineSummary);
           info.appendChild(lineText);

           if (isFinished) {
               const statusWrap = document.createElement('div');
               statusWrap.className = 'mt-2 flex items-center gap-2 flex-wrap';
               const statusBadge = document.createElement('span');
               const success = normalizedTask.resultStatus === 'success';
               statusBadge.className = success
                   ? 'inline-block px-2 py-0.5 text-xs rounded border border-green-500 text-green-700 bg-green-50'
                   : 'inline-block px-2 py-0.5 text-xs rounded border border-red-500 text-red-700 bg-red-50';
               statusBadge.textContent = success ? 'Success' : 'Failed';
               const infoText = document.createElement('span');
               infoText.className = 'text-sm text-gray-600';
               infoText.textContent = normalizedTask.resultInfo || '-';
               statusWrap.appendChild(statusBadge);
               statusWrap.appendChild(infoText);
               info.appendChild(statusWrap);
           }

           const actions = document.createElement('div');
           actions.className = 'flex gap-2';
           if (isPending) {
               const payBtn = document.createElement('button');
               payBtn.type = 'button';
               payBtn.className = 'text-green-600 hover:text-green-700 text-sm';
               payBtn.innerHTML = '<i class="fa fa-shopping-cart mr-1"></i>购买';
               payBtn.dataset.action = 'pay';
               payBtn.dataset.panel = 'pending';

               const delBtn = document.createElement('button');
               delBtn.type = 'button';
               delBtn.className = 'text-red-500 hover:text-red-600 text-sm';
               delBtn.innerHTML = '<i class="fa fa-trash mr-1"></i>删除';
               delBtn.dataset.action = 'delete';
               delBtn.dataset.panel = 'pending';

               actions.appendChild(payBtn);
               actions.appendChild(delBtn);
           } else if (!isFinished) {
               const delBtn = document.createElement('button');
               delBtn.type = 'button';
               delBtn.className = 'text-red-500 hover:text-red-600 text-sm';
               delBtn.innerHTML = '<i class="fa fa-trash mr-1"></i>删除';
               delBtn.dataset.action = 'delete';
               delBtn.dataset.panel = 'added';
               actions.appendChild(delBtn);
           }

           item.appendChild(info);
           if (!isFinished || isPending) {
               item.appendChild(actions);
           }
           return item;
       }

       function renderTaskList(container, tasks, panel) {
           container.innerHTML = '';
           if (!Array.isArray(tasks) || tasks.length === 0) return;
           tasks.forEach(task => container.appendChild(createTaskItem(task, panel)));
       }

       function getPanelElements(panel) {
           if (panel === 'pending') {
               return { list: pendingList, info: pageInfoPending, prev: prevPendingBtn, next: nextPendingBtn };
           }
           if (panel === 'finished') {
               return { list: finishedList, info: pageInfoFinished, prev: prevFinishedBtn, next: nextFinishedBtn };
           }
           return { list: addedList, info: pageInfoAdded, prev: prevAddedBtn, next: nextAddedBtn };
       }

       function getPageCount(panel) {
           const state = pagerState[panel];
           if (!state || state.tasks.length === 0) return 1;
           return Math.max(1, Math.ceil(state.tasks.length / state.pageSize));
       }

       function renderPanel(panel) {
           const state = pagerState[panel];
           const elements = getPanelElements(panel);
           const pageCount = getPageCount(panel);
           if (state.page > pageCount) state.page = pageCount;
           if (state.page < 1) state.page = 1;

           const start = (state.page - 1) * state.pageSize;
           const end = start + state.pageSize;
           const pagedTasks = state.tasks.slice(start, end);

           renderTaskList(elements.list, pagedTasks, panel);
           elements.info.textContent = `第 ${state.page} / ${pageCount} 页`;
           elements.prev.disabled = state.page <= 1;
           elements.next.disabled = state.page >= pageCount;
           renderStatusGrid();
       }

       function parseCourtNumber(courtValue) {
           const value = String(courtValue || '');
           const match = value.match(/\d+/);
           if (!match) return -1;
           const num = Number(match[0]);
           if (Number.isNaN(num) || num < 1 || num > 12) return -1;
           return num;
       }

       function parseTimeIndex(timeValue) {
           const formatted = formatTimeRange(timeValue);
           const match = formatted.match(/^(\d{1,2}):00-/);
           if (!match) return -1;
           const hour = Number(match[1]);
           if (Number.isNaN(hour) || hour < 8 || hour > 21) return -1;
           return hour - 8;
       }

       function statusToCellClass(value) {
           const status = Number(value);
           if (status === 1) return 'cell-success';
           if (status === 2) return 'cell-teaching';
           if (status === 3) return 'cell-timeout';
           if (status === 4) return 'cell-future';
           if (status === 0) return 'cell-failed';
           return 'cell-empty';
       }

       function isReservable(courtValue, timeValue) {
           const court = Number(courtValue);
           const time = Number(timeValue);
           if (!court || !time) return false;
           const courtIndex = court - 1;
           const timeIndex = time - 8;
           if (courtIndex < 0 || courtIndex >= 12 || timeIndex < 0 || timeIndex >= gridTimeSlots.length) return false;
           const courtRow = Array.isArray(gridTableData[courtIndex]) ? gridTableData[courtIndex] : [];
           return statusToCellClass(courtRow[timeIndex]) === 'cell-success';
       }

       function hasAnyAvailableTime(courtValue) {
           for (let time = 8; time <= 21; time++) {
               if (isReservable(courtValue, time)) return true;
           }
           return false;
       }

       function hasAnyAvailableCourt(timeValue) {
           for (let court = 1; court <= 12; court++) {
               if (isReservable(court, timeValue)) return true;
           }
           return false;
       }

       function updateSelectableOptions() {
           const selectedCourt = numSelect.value;
           const selectedTime = textSelect.value;

           Array.from(numSelect.options).forEach(option => {
               if (!option.value) { option.disabled = false; return; }
               option.disabled = selectedTime
                   ? !isReservable(option.value, selectedTime)
                   : !hasAnyAvailableTime(option.value);
           });

           Array.from(textSelect.options).forEach(option => {
               if (!option.value) { option.disabled = false; return; }
               option.disabled = selectedCourt
                   ? !isReservable(selectedCourt, option.value)
                   : !hasAnyAvailableCourt(option.value);
           });

           const selectedCourtOption = numSelect.options[numSelect.selectedIndex];
           if (selectedCourtOption && selectedCourtOption.value && selectedCourtOption.disabled) {
               numSelect.value = '';
           }

           const selectedTimeOption = textSelect.options[textSelect.selectedIndex];
           if (selectedTimeOption && selectedTimeOption.value && selectedTimeOption.disabled) {
               textSelect.value = '';
           }

           updateSubmitAvailability();
       }

       function updateSubmitAvailability() {
           const court = Number(numSelect.value);
           const time = Number(textSelect.value);
           if (!court || !time) {
               addBtn.disabled = true;
               addBtn.classList.add('opacity-60', 'cursor-not-allowed');
               return;
           }
           const canSubmit = isReservable(court, time);
           addBtn.disabled = !canSubmit;
           if (canSubmit) {
               addBtn.classList.remove('opacity-60', 'cursor-not-allowed');
           } else {
               addBtn.classList.add('opacity-60', 'cursor-not-allowed');
           }
       }

       function normalizeGridTable(tableData) {
           if (Array.isArray(tableData)) return tableData;
           if (tableData && Array.isArray(tableData.data)) {
               return tableData.data.map(court => {
                   if (Array.isArray(court)) return court;
                   return gridTimeSlots.map((_, idx) => {
                       const hour = 8 + idx;
                       return Number(court && court[`time${hour}`] != null ? court[`time${hour}`] : 0);
                   });
               });
           }
           return [];
       }

       function renderStatusGrid() {
           const selectedDate = dateInput.value || getTodayDate();
           const weekText = getWeekdayText(selectedDate);
           statusGridDate.textContent = weekText ? `(${selectedDate} ${weekText})` : `(${selectedDate})`;
           statusGridLastUpdate.textContent = `Last Update：${getNowDateTimeString()}`;

           const map = Array.from({ length: 12 }, () => Array.from({ length: gridTimeSlots.length }, () => 'cell-empty'));

           for (let court = 0; court < 12; court++) {
               const courtRow = Array.isArray(gridTableData[court]) ? gridTableData[court] : [];
               for (let col = 0; col < gridTimeSlots.length; col++) {
                   map[court][col] = statusToCellClass(courtRow[col]);
               }
           }

           let html = '<thead><tr><th>场地\\时间</th>';
           gridTimeSlots.forEach(slot => { html += `<th>${slot}</th>`; });
           html += '</tr></thead><tbody>';

           for (let court = 1; court <= 12; court++) {
               html += `<tr><th>场地${court}</th>`;
               for (let col = 0; col < gridTimeSlots.length; col++) {
                   const cellClass = map[court - 1][col];
                   const clickClass = cellClass === 'cell-success' ? ' cursor-pointer' : '';
                   html += `<td class="${cellClass}${clickClass}" data-court="${court}" data-time="${8 + col}"></td>`;
               }
               html += '</tr>';
           }
           html += '</tbody>';
           statusGrid.innerHTML = html;
           updateSelectableOptions();
       }

       function setPanelTasks(panel, tasks) {
           pagerState[panel].tasks = Array.isArray(tasks) ? tasks : [];
           pagerState[panel].page = 1;
           renderPanel(panel);
       }

       function changePage(panel, delta) {
           pagerState[panel].page += delta;
           renderPanel(panel);
       }

       function handleStatusGridClick(event) {
           const cell = event.target.closest('td');
           if (!cell || !statusGrid.contains(cell) || !cell.classList.contains('cell-success')) return;
           const court = String(cell.dataset.court || '');
           const time = String(cell.dataset.time || '');
           const selectedDate = dateInput.value || getTodayDate();
           if (!court || !time) return;
           dateInput.value = selectedDate;
           numSelect.value = court;
           textSelect.value = time;
           updateSelectableOptions();
           setFormMessage('info', `已选择: ${selectedDate}, Court-${court} ${time}:00-${Number(time) + 1}:00`);
       }

       function handleListAction(event) {
           const actionBtn = event.target.closest('button[data-action]');
           if (!actionBtn) return;
           const action = actionBtn.dataset.action;
           const panel = actionBtn.dataset.panel || 'added';
           if (panel === 'pending') {
               if (action === 'delete') removePendingItem(actionBtn);
               else if (action === 'pay') payPendingItem(actionBtn);
               return;
           }
           if (action === 'delete') removeItem(actionBtn);
       }

       async function addItem() {
           const dateVal = dateInput.value;
           const courtVal = numSelect.value;
           const timeVal = textSelect.value;
           if (!courtVal || !timeVal) {
               setFormMessage('error', '请添加任务');
               return;
           }
           if (addBtn.disabled) {
               setFormMessage('error', '所选场地时间不可预约');
               return;
           }

           setButtonLoading(addBtn, true, '提交中...');
           try {
               const result = await postToServer(API_ENDPOINTS.addTask, {
                   date: dateVal,
                   court: courtVal,
                   time: timeVal
               });
               const taskFromServer = result.task || result.data || { date: dateVal, court: courtVal, time: timeVal, text: '' };
               if (!taskFromServer.message) {
                   taskFromServer.message = result.message || '';
               }
               pagerState.added.tasks.unshift(taskFromServer);
               renderPanel('added');
               setFormMessage('success', result.message || '任务添加成功');
               dateInput.value = getTodayDate();
               numSelect.value = '';
               textSelect.value = '';
               await Promise.allSettled([
                   refreshGridOnly(),
                   refreshTasks('added'),
                   refreshTasks('pending'),
                   refreshTasks('finished')
               ]);
           } catch (error) {
               setFormMessage('error', error.message || '提交失败，请稍后重试');
           } finally {
               setButtonLoading(addBtn, false, '提交中...');
               updateSubmitAvailability();
           }
       }

       async function refreshTasks(panel) {
           const targetBtn = panel === 'added'
               ? refreshAddedBtn
               : (panel === 'pending' ? refreshPendingBtn : refreshFinishedBtn);
           const requestType = panel === 'added'
               ? 'processing'
               : (panel === 'pending' ? 'pendingpayment' : 'finished');
           setButtonLoading(targetBtn, true, '刷新中...');
           try {
               const result = await postToServer(API_ENDPOINTS.refreshTasks, { type: requestType });
               const tasks = Array.isArray(result.data) ? result.data : (Array.isArray(result.tasks) ? result.tasks : []);
               const responseType = (result.type || '').toLowerCase();
               let targetPanel = panel;
               if (responseType === 'finished') targetPanel = 'finished';
               else if (responseType === 'pendingpayment') targetPanel = 'pending';
               else if (responseType === 'processing') targetPanel = 'added';
               setPanelTasks(targetPanel, tasks);
               setPanelMessage(targetPanel, 'success', result.message || '刷新成功');
           } catch (error) {
               setPanelMessage(panel, 'error', error.message || '刷新失败，请稍后重试');
           } finally {
               setButtonLoading(targetBtn, false, '刷新中...');
           }
       }

       async function removeItem(el) {
           const item = el.closest('[data-task-item]');
           if (!item) return;
           const uniqueid = item.dataset.uniqueid;
           if (!uniqueid) {
               setPanelMessage('added', 'error', '任务缺少 uniqueid，无法删除');
               return;
           }
           setButtonLoading(el, true, '删除中...');
           try {
               const result = await postToServer(API_ENDPOINTS.deleteTask, { uniqueid: uniqueid });
               pagerState.added.tasks = pagerState.added.tasks.filter(task => String(task.uniqueid || task.uniqueId || task.id || '') !== String(uniqueid));
               pagerState.finished.tasks = pagerState.finished.tasks.filter(task => String(task.uniqueid || task.uniqueId || task.id || '') !== String(uniqueid));
               renderPanel('added');
               renderPanel('finished');
               setPanelMessage('added', 'success', result.message || '删除成功');
           } catch (error) {
               setPanelMessage('added', 'error', error.message || '删除失败，请稍后重试');
           } finally {
               setButtonLoading(el, false, '删除中...');
           }
       }

       async function initializeTaskPanels() {
           await loadAutoPayStatus();
           await refreshGridOnly();
           await Promise.allSettled([refreshTasks('added'), refreshTasks('pending'), refreshTasks('finished')]);
            await refreshLoginStat(false);
       }

        function setLoginValidateBadge(validate) {
            loginStatValidate.classList.remove(
                'border-gray-300', 'text-gray-600', 'bg-gray-100',
                'border-green-500', 'text-green-700', 'bg-green-100',
                'border-red-500', 'text-red-700', 'bg-red-100'
            );
            if (validate === true) {
                loginStatValidate.classList.add('border-green-500', 'text-green-700', 'bg-green-100');
                loginStatValidate.textContent = '可用';
                return;
            }
            if (validate === false) {
                loginStatValidate.classList.add('border-red-500', 'text-red-700', 'bg-red-100');
                loginStatValidate.textContent = '不可用';
                return;
            }
            loginStatValidate.classList.add('border-gray-300', 'text-gray-600', 'bg-gray-100');
            loginStatValidate.textContent = '未知';
        }

       async function removePendingItem(el) {
           const item = el.closest('[data-task-item]');
           if (!item) return;
           const uniqueid = item.dataset.uniqueid;
           if (!uniqueid) {
               setPanelMessage('pending', 'error', '任务缺少 uniqueid，无法删除');
               return;
           }
           setButtonLoading(el, true, '删除中...');
           try {
                const result = await postToServer(API_ENDPOINTS.deletePending, { uniqueid: uniqueid });
               pagerState.pending.tasks = pagerState.pending.tasks.filter(task => String(task.uniqueid || task.uniqueId || task.id || '') !== String(uniqueid));
               renderPanel('pending');
               setPanelMessage('pending', 'success', result.message || '删除成功');
           } catch (error) {
               setPanelMessage('pending', 'error', error.message || '删除失败，请稍后重试');
           } finally {
               setButtonLoading(el, false, '删除中...');
           }
       }

       async function payPendingItem(el) {
           const item = el.closest('[data-task-item]');
           if (!item) return;
           const uniqueid = item.dataset.uniqueid;
           if (!uniqueid) {
               setPanelMessage('pending', 'error', '任务缺少 uniqueid，无法购买');
               return;
           }
           setButtonLoading(el, true, '购买中...');
           try {
               const result = await postToServer(API_ENDPOINTS.payPending, { uniqueid: uniqueid });
               pagerState.pending.tasks = pagerState.pending.tasks.filter(task => String(task.uniqueid || task.uniqueId || task.id || '') !== String(uniqueid));
               renderPanel('pending');
               setPanelMessage('pending', 'success', result.message || '购买成功');
               await refreshTasks('finished');
           } catch (error) {
               setPanelMessage('pending', 'error', error.message || '购买失败，请稍后重试');
           } finally {
               setButtonLoading(el, false, '购买中...');
           }
       }

        function formatTimestampToDateTime(rawValue) {
            if (rawValue === undefined || rawValue === null || rawValue === '') return '-';

            const valueText = String(rawValue).trim();
            if (!valueText) return '-';

            let timestamp = Number(valueText);
            if (Number.isNaN(timestamp)) {
                const parsed = new Date(valueText);
                if (Number.isNaN(parsed.getTime())) return valueText;
                timestamp = parsed.getTime();
            }

            if (timestamp > 0 && timestamp < 1000000000000) {
                timestamp = timestamp * 1000;
            }

            const dateObj = new Date(timestamp);
            if (Number.isNaN(dateObj.getTime())) return valueText;

            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            const hh = String(dateObj.getHours()).padStart(2, '0');
            const mi = String(dateObj.getMinutes()).padStart(2, '0');
            const ss = String(dateObj.getSeconds()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
        }

        function setLoginStatInfo(data) {
            const token = data && data.token != null ? String(data.token) : '-';
            const username = data && data.username != null ? String(data.username) : '-';
            const lastCheckTimeRaw = data && data.lastCheckTime != null ? data.lastCheckTime : null;
            const lastUpdateTimeRaw = data && data.lastUpdateTIme != null ? data.lastUpdateTIme : (data && data.lastUpdateTime != null ? data.lastUpdateTime : null);
            loginStatToken.textContent = token;
            loginStatUsername.textContent = username;
            loginStatLastCheckTime.textContent = formatTimestampToDateTime(lastCheckTimeRaw);
            loginStatLastUpdateTime.textContent = formatTimestampToDateTime(lastUpdateTimeRaw);
            setLoginValidateBadge(data ? data.validate : undefined);
        }

        async function refreshLoginStat(checkToken) {
            const targetBtn = checkToken ? checkLoginStatBtn : refreshLoginStatBtn;
            setButtonLoading(targetBtn, true, checkToken ? '检查中...' : '刷新中...');
            try {
                const payload = { type: 'loginstat' };
                if (checkToken) {
                    payload.checktoken = true;
                }
                const result = await postToServer(API_ENDPOINTS.refreshTasks, payload);
                const data = result && result.data && typeof result.data === 'object' ? result.data : {};
                setLoginStatInfo(data);
            } catch (error) {
                setLoginValidateBadge(undefined);
            } finally {
                setButtonLoading(targetBtn, false, checkToken ? '检查中...' : '刷新中...');
            }
        }

       async function refreshGridOnly() {
           const result = await postToServer(API_ENDPOINTS.refreshGrid, {
               type: 'table',
               date: dateInput.value || getTodayDate()
           });
           const data = result && result.data && typeof result.data === 'object' ? result.data : {};
           gridTableData = normalizeGridTable(data.table);
           renderStatusGrid();
       }

       // 事件绑定
       addBtn.addEventListener('click', addItem);
       refreshAddedBtn.addEventListener('click', () => refreshTasks('added'));
       refreshPendingBtn.addEventListener('click', () => refreshTasks('pending'));
       refreshFinishedBtn.addEventListener('click', () => refreshTasks('finished'));
       addedList.addEventListener('click', handleListAction);
       pendingList.addEventListener('click', handleListAction);
       finishedList.addEventListener('click', handleListAction);
       statusGrid.addEventListener('click', handleStatusGridClick);
       pageSizeAdded.addEventListener('change', function () {
           pagerState.added.pageSize = Number(pageSizeAdded.value) || 5;
           pagerState.added.page = 1;
           renderPanel('added');
       });
       pageSizePending.addEventListener('change', function () {
           pagerState.pending.pageSize = Number(pageSizePending.value) || 5;
           pagerState.pending.page = 1;
           renderPanel('pending');
       });
       pageSizeFinished.addEventListener('change', function () {
           pagerState.finished.pageSize = Number(pageSizeFinished.value) || 5;
           pagerState.finished.page = 1;
           renderPanel('finished');
       });
       prevAddedBtn.addEventListener('click', () => changePage('added', -1));
       nextAddedBtn.addEventListener('click', () => changePage('added', 1));
       prevPendingBtn.addEventListener('click', () => changePage('pending', -1));
       nextPendingBtn.addEventListener('click', () => changePage('pending', 1));
       prevFinishedBtn.addEventListener('click', () => changePage('finished', -1));
       nextFinishedBtn.addEventListener('click', () => changePage('finished', 1));
       refreshGridBtn.addEventListener('click', async function () {
           setButtonLoading(refreshGridBtn, true, '刷新中...');
           try {
               await refreshGridOnly();
           } finally {
               setButtonLoading(refreshGridBtn, false, '刷新中...');
           }
       });
       refreshLoginStatBtn.addEventListener('click', function () {
            refreshLoginStat(false);
        });
        checkLoginStatBtn.addEventListener('click', function () {
            refreshLoginStat(true);
        });
       autopaySwitch.addEventListener('change', changeAutoPayStatus);

       // 初始渲染
       renderPanel('added');
       renderPanel('pending');
       renderPanel('finished');
       updateSelectableOptions();
       initializeTaskPanels();
   </script>
</body>
</html>
